<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Busque uma melhor conexão com o seu cliente, sem marketings absurdamente caros, ou comerciais sem sentido, algo que realmente faça seu cliente se sentir amado por você">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>Unli - Unlimited ideas, unlimited world</title>

    <!-- Preconnect: acelera conexão com domínios externos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload da stylesheet de fontes críticas (Syne é usada no LCP hero title) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Inter:wght@400;500;600;700&family=Raleway:wght@400;600;700;800&family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" as="style" onload="this.rel='stylesheet';this.onload=null">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://connect.facebook.net">
    <link rel="dns-prefetch" href="https://www.clarity.ms">

    <!-- Google Fonts: carregamento não-bloqueante (weights reduzidos) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Inter:wght@400;500;600;700&family=Raleway:wght@400;600;700;800&family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Inter:wght@400;500;600;700&family=Raleway:wght@400;600;700;800&family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap"></noscript>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->

    <!-- Scripts de terceiros: carregados após o conteúdo principal -->
    <script>
      // Carrega scripts de analytics somente após a página renderizar
      function loadDeferredScripts() {
        // Google Tag Manager
        var gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=<%= process.env.VUE_APP_GA_ID %>';
        document.head.appendChild(gtagScript);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', '<%= process.env.VUE_APP_GA_ID %>', {
          send_page_view: false
        });

        // Meta Pixel
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1569295004153014');
        fbq('track', 'PageView');

        // Microsoft Clarity
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "v5ltgwoen2");
      }

      // Aguarda a página estar interativa para carregar analytics
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadDeferredScripts, { timeout: 3000 });
      } else {
        window.addEventListener('load', function() {
          setTimeout(loadDeferredScripts, 100);
        });
      }
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1569295004153014&ev=PageView&noscript=1"
    /></noscript>
  </body>
</html>
